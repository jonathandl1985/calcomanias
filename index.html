<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Streaming en Vivo</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --surface-color: #16161a;
            --surface-accent: #222227;
            --primary-color: #ff3366;
            --text-color: #efefef;
            --text-muted: #94a3b8;
            --border-color: #2a2a35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: block;
            min-height: 100vh;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .main-layout {
            display: table;
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 15px;
            padding: 5px;
        }

        .sidebar {
            display: table-cell;
            width: 280px;
            vertical-align: top;
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
            color: var(--text-color);
        }

        .sidebar-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .sidebar-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }

        .center-content {
            display: table-cell;
            vertical-align: top;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .chat-container {
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            height: 380px;
            display: flex;
            flex-direction: column;
        }

        .chat-container h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .chat-message {
            margin-bottom: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-message .username {
            font-weight: bold;
            color: var(--primary-color);
            margin-right: 5px;
        }

        /* DISEÑO FORMULARIO ACCESO CHAT */
        .chat-auth-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
            margin: auto;
            text-align: center;
        }

        .chat-auth-box input {
            background-color: var(--surface-accent);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        .chat-auth-box .row-btns {
            display: flex;
            gap: 10px;
        }

        .chat-auth-box button {
            flex: 1;
        }

        .chat-auth-box .toggle-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: underline;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex-grow: 1;
            background-color: var(--surface-accent);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #e02454; }
        .btn-secondary { background-color: #4a5568; }
        .btn-secondary:hover { background-color: #2d3748; }

        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .main-layout, .sidebar, .center-content { display: block; width: 100%; }
            .sidebar { margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Transmisión en Vivo Oficial</h1>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <h2>Noticias</h2>
            <div class="sidebar-content" id="news-left-container">Cargando últimas noticias...</div>
        </aside>

        <div class="center-content">
            <div class="video-container">
                <iframe id="stream-player" src="" allow="autoplay; encrypted-media;" allowfullscreen></iframe>
            </div>

            <div class="chat-container">
                <h2>Chat en Vivo</h2>
                
                <div id="chat-auth" class="chat-auth-box">
                    <p id="auth-title">Inicia sesión para chatear</p>
                    <input type="text" id="auth-username" placeholder="Nombre de usuario">
                    <input type="password" id="auth-password" placeholder="Contraseña">
                    
                    <div class="row-btns">
                        <button class="btn" id="btn-login">Ingresar</button>
                        <button class="btn btn-secondary" id="btn-register">Registrarse</button>
                    </div>
                </div>

                <div id="chat-active" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
                    <div class="chat-messages" id="chat-messages-box"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input-field" placeholder="Escribe un mensaje aquí...">
                        <button class="btn" id="btn-send-message">Enviar</button>
                    </div>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <h2>Destacados</h2>
            <div class="sidebar-content" id="news-right-container">Cargando contenido destacado...</div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURACIÓN DE TU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB0JWN4bRHZ8f2tZEQwnxBW8hGmP9XPaEA",
            authDomain: "calcos-6760b.firebaseapp.com",
            databaseURL: "https://calcos-6760b-default-rtdb.firebaseio.com",
            projectId: "calcos-6760b",
            storageBucket: "calcos-6760b.firebasestorage.app",
            messagingSenderId: "20210064860",
            appId: "1:20210064860:web:01db78b92e3b0d43400319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ELEMENTOS DOM
        const streamPlayer = document.getElementById('stream-player');
        const newsLeftContainer = document.getElementById('news-left-container');
        const newsRightContainer = document.getElementById('news-right-container');
        
        const chatAuth = document.getElementById('chat-auth');
        const chatActive = document.getElementById('chat-active');
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const btnLogin = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');

        const chatMessagesBox = document.getElementById('chat-messages-box');
        const chatInputField = document.getElementById('chat-input-field');
        const btnSendMessage = document.getElementById('btn-send-message');

        let usuarioActual = null;

        // 1. SINCRONIZACIÓN EN TIEMPO REAL DEL REPRODUCTOR Y PANELES
        onValue(ref(db, 'live_config'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.streamUrl) streamPlayer.src = data.streamUrl;
                newsLeftContainer.innerHTML = data.newsLeft || "No hay noticias.";
                newsRightContainer.innerHTML = data.newsRight || "No hay contenido.";
            }
        });

        // Ocultar/Mostrar chat basado en si Firebase Auth detecta sesión activa
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Al usar cuentas simuladas con email, usamos el displayName como apodo
                usuarioActual = user.displayName || "Usuario";
                chatAuth.classList.add('hidden');
                chatActive.classList.remove('hidden');
            } else {
                usuarioActual = null;
                chatAuth.classList.remove('hidden');
                chatActive.classList.add('hidden');
            }
        });

        // 2. SISTEMA DE REGISTRO LOCAL (Crea cuentas simulando Nombre de Usuario)
        btnRegister.addEventListener('click', () => {
            const username = authUsername.value.trim().toLowerCase();
            const password = authPassword.value;

            if (username.length < 3 || password.length < 6) {
                alert("El usuario debe tener mínimo 3 letras y la contraseña mínimo 6 caracteres.");
                return;
            }

            // Para no complicar la interfaz pidiendo un correo real, el sistema crea un correo técnico
            // invisible en base al apodo que elijan. Ejemplo: pedro -> pedro@chatlocal.com
            const emailSimulado = `${username}@chatlocal.com`;

            // Verificar primero si el usuario ya existe para dar un error limpio
            createUserWithEmailAndPassword(auth, emailSimulado, password)
                .then((userCredential) => {
                    // Guardamos el nombre real con mayúsculas/minúsculas para el chat
                    const user = userCredential.user;
                    // Firebase necesita asignar el display name de esta manera
                    // Para simplificar, usamos una función de actualización nativa en el chat tras el envío o lo registramos directamente.
                    alert("¡Cuenta creada con éxito! Ya puedes escribir en el chat.");
                    // Guardamos el apodo original escrito por el usuario
                    usuarioActual = authUsername.value.trim();
                })
                .catch((error) => {
                    if (error.code === 'auth/email-already-in-use') {
                        alert("Este nombre de usuario ya está registrado por otra persona.");
                    } else {
                        alert("Error al registrar: " + error.message);
                    }
                });
        });

        // 3. SISTEMA DE INICIO DE SESIÓN LOCAL
        btnLogin.addEventListener('click', () => {
            const username = authUsername.value.trim().toLowerCase();
            const password = authPassword.value;

            if (!username || !password) {
                alert("Por favor rellena ambos campos.");
                return;
            }

            const emailSimulado = `${username}@chatlocal.com`;

            signInWithEmailAndPassword(auth, emailSimulado, password)
                .then(() => {
                    // Guardamos el apodo original de forma visible
                    usuarioActual = authUsername.value.trim();
                })
                .catch((error) => {
                    alert("Usuario o contraseña incorrectos.");
                });
        });

        // 4. ENVÍO Y RECEPCIÓN DE MENSAJES
        function enviarMensaje() {
            const texto = chatInputField.value.trim();
            if (!texto || !usuarioActual) return;

            push(ref(db, 'live_chat'), {
                username: usuarioActual,
                message: texto,
                timestamp: Date.now()
            });

            chatInputField.value = '';
        }

        btnSendMessage.addEventListener('click', enviarMensaje);
        chatInputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        // Escuchar la base de datos para pintar los mensajes en pantalla
        onValue(ref(db, 'live_chat'), (snapshot) => {
            chatMessagesBox.innerHTML = '';
            snapshot.forEach((childSnapshot) => {
                const msgData = childSnapshot.val();
                
                const messageEl = document.createElement('div');
                messageEl.className = 'chat-message';
                
                const usernameEl = document.createElement('span');
                usernameEl.className = 'username';
                usernameEl.textContent = msgData.username + ":";

                const textEl = document.createTextNode(" " + msgData.message);

                messageEl.appendChild(usernameEl);
                messageEl.appendChild(textEl);
                chatMessagesBox.appendChild(messageEl);
            });
            chatMessagesBox.scrollTop = chatMessagesBox.scrollHeight;
        });
    </script>
</body>
</html>
