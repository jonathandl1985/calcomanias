<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Streaming en Vivo</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --surface-color: #16161a;
            --surface-accent: #222227;
            --primary-color: #ff3366;
            --text-color: #efefef;
            --text-muted: #94a3b8;
            --border-color: #2a2a35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: block;
            min-height: 100vh;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .main-layout {
            display: table;
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 15px;
            padding: 5px;
        }

        .sidebar {
            display: table-cell;
            width: 280px;
            vertical-align: top;
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
            color: var(--text-color);
        }

        .sidebar-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-muted);
        }

        /* Fuerza a que cualquier iframe de Facebook o anuncio lateral sea responsivo */
        .sidebar-content iframe, .sidebar-content img {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 100% !important;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .center-content {
            display: table-cell;
            vertical-align: top;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .chat-container {
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            height: 410px;
            display: flex;
            flex-direction: column;
        }

        .chat-container h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        /* DISEÑO DE CONTADORES */
        .stats-banner {
            background: var(--surface-accent);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .chat-message {
            margin-bottom: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-message .username {
            font-weight: bold;
            color: var(--primary-color);
            margin-right: 5px;
        }

        /* ACCESO CHAT LOCAL */
        .chat-auth-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
            margin: auto;
            text-align: center;
        }

        .chat-auth-box input {
            background-color: var(--surface-accent);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        .chat-auth-box .row-btns {
            display: flex;
            gap: 10px;
        }

        .chat-auth-box button {
            flex: 1;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex-grow: 1;
            background-color: var(--surface-accent);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #e02454; }
        .btn-secondary { background-color: #4a5568; }
        .btn-secondary:hover { background-color: #2d3748; }

        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .main-layout, .sidebar, .center-content { display: block; width: 100%; }
            .sidebar { margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Transmisión en Vivo Oficial</h1>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <h2>Noticias</h2>
            <div class="sidebar-content" id="news-left-container">Cargando contenido lateral...</div>
        </aside>

        <div class="center-content">
            <div class="video-container">
                <iframe id="stream-player" src="" allow="autoplay; encrypted-media;" allowfullscreen></iframe>
            </div>

            <div class="chat-container">
                <h2>Chat en Vivo</h2>
                
                <div class="stats-banner">
                    <div>🟢 En línea: <strong id="count-online" style="color: #2ecc71;">0</strong></div>
                    <div>📊 Visitas totales: <strong id="count-total" style="color: #3498db;">0</strong></div>
                </div>
                
                <div id="chat-auth" class="chat-auth-box">
                    <p>Inicia sesión con tu apodo para chatear</p>
                    <input type="text" id="auth-username" placeholder="Nombre de usuario">
                    <input type="password" id="auth-password" placeholder="Contraseña (mín. 6 letras)">
                    
                    <div class="row-btns">
                        <button class="btn" id="btn-login">Ingresar</button>
                        <button class="btn btn-secondary" id="btn-register">Registrarse</button>
                    </div>
                </div>

                <div id="chat-active" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
                    <div class="chat-messages" id="chat-messages-box"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input-field" placeholder="Escribe un mensaje aquí...">
                        <button class="btn" id="btn-send-message">Enviar</button>
                    </div>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <h2>Destacados</h2>
            <div class="sidebar-content" id="news-right-container">Cargando contenido lateral...</div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // =========================================================================
        // ⚠️ PEGA AQUÍ LAS CREDENCIALES DE TU PROYECTO DE FIREBASE
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB0JWN4bRHZ8f2tZEQwnxBW8hGmP9XPaEA",
            authDomain: "calcos-6760b.firebaseapp.com",
            databaseURL: "https://calcos-6760b-default-rtdb.firebaseio.com",
            projectId: "calcos-6760b",
            storageBucket: "calcos-6760b.firebasestorage.app",
            messagingSenderId: "20210064860",
            appId: "1:20210064860:web:01db78b92e3b0d43400319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ELEMENTOS DOM
        const streamPlayer = document.getElementById('stream-player');
        const newsLeftContainer = document.getElementById('news-left-container');
        const newsRightContainer = document.getElementById('news-right-container');
        
        const chatAuth = document.getElementById('chat-auth');
        const chatActive = document.getElementById('chat-active');
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const btnLogin = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');

        const chatMessagesBox = document.getElementById('chat-messages-box');
        const chatInputField = document.getElementById('chat-input-field');
        const btnSendMessage = document.getElementById('btn-send-message');
        
        const txtOnline = document.getElementById('count-online');
        const txtTotal = document.getElementById('count-total');

        let usuarioActual = null;

        // 1. SINCRONIZACIÓN EN TIEMPO REAL DEL REPRODUCTOR Y CONTENIDOS HTML
        onValue(ref(db, 'live_config'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.streamUrl) streamPlayer.src = data.streamUrl;
                newsLeftContainer.innerHTML = data.newsLeft || "No hay contenidos.";
                newsRightContainer.innerHTML = data.newsRight || "No hay contenidos.";
            }
        });

        // 2. SISTEMA DE CONTADORES EN TIEMPO REAL (PRESENCIA)
        const onlineRef = ref(db, 'usuarios_online');
        const totalRef = ref(db, 'visitas_totales');
        const connectedRef = ref(db, '.info/connected');

        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                // Sumar usuario en línea activo
                runTransaction(onlineRef, (val) => (val || 0) + 1);
                // Sumar al histórico global acumulado
                runTransaction(totalRef, (val) => (val || 0) + 1);
                // Programar resta automática al salir de la web
                onDisconnect(onlineRef).runTransaction((val) => (val ? val - 1 : 0));
            }
        });

        onValue(onlineRef, (snap) => { txtOnline.textContent = snap.val() || 0; });
        onValue(totalRef, (snap) => { txtTotal.textContent = snap.val() || 0; });

        // 3. CONTROL DE ESTADO DEL CHAT
        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioActual = user.displayName || localStorage.getItem('chat_alias') || "Usuario";
                chatAuth.classList.add('hidden');
                chatActive.classList.remove('hidden');
            } else {
                usuarioActual = null;
                chatAuth.classList.remove('hidden');
                chatActive.classList.add('hidden');
            }
        });

        // 4. REGISTRO LOCAL SIMULADO
        btnRegister.addEventListener('click', () => {
            const username = authUsername.value.trim().toLowerCase();
            const password = authPassword.value;
            const originalAlias = authUsername.value.trim();

            if (username.length < 3 || password.length < 6) {
                alert("El usuario requiere mín. 3 letras y la clave mín. 6 caracteres.");
                return;
            }

            const emailSimulado = `${username}@chatlocal.com`;

            createUserWithEmailAndPassword(auth, emailSimulado, password)
                .then(() => {
                    localStorage.setItem('chat_alias', originalAlias);
                    usuarioActual = originalAlias;
                    alert("¡Cuenta creada! Ya puedes participar en el chat.");
                })
                .catch((error) => {
                    if (error.code === 'auth/email-already-in-use') {
                        alert("Este nombre de usuario ya está ocupado.");
                    } else {
                        alert("Error: " + error.message);
                    }
                });
        });

        // 5. LOGIN LOCAL SIMULADO
        btnLogin.addEventListener('click', () => {
            const username = authUsername.value.trim().toLowerCase();
            const password = authPassword.value;
            const originalAlias = authUsername.value.trim();

            if (!username || !password) {
                alert("Rellena todos los campos.");
                return;
            }

            const emailSimulado = `${username}@chatlocal.com`;

            signInWithEmailAndPassword(auth, emailSimulado, password)
                .then(() => {
                    localStorage.setItem('chat_alias', originalAlias);
                    usuarioActual = originalAlias;
                })
                .catch(() => {
                    alert("Usuario o contraseña incorrectos.");
                });
        });

        // 6. ENVÍO Y RENDERIZADO DE CHAT
        function enviarMensaje() {
            const texto = chatInputField.value.trim();
            if (!texto || !usuarioActual) return;

            push(ref(db, 'live_chat'), {
                username: usuarioActual,
                message: texto,
                timestamp: Date.now()
            });
            chatInputField.value = '';
        }

        btnSendMessage.addEventListener('click', enviarMensaje);
        chatInputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensaje(); });

        onValue(ref(db, 'live_chat'), (snapshot) => {
            chatMessagesBox.innerHTML = '';
            snapshot.forEach((childSnapshot) => {
                const msgData = childSnapshot.val();
                const messageEl = document.createElement('div');
                messageEl.className = 'chat-message';
                
                const usernameEl = document.createElement('span');
                usernameEl.className = 'username';
                usernameEl.textContent = msgData.username + ":";

                const textEl = document.createTextNode(" " + msgData.message);
                messageEl.appendChild(usernameEl);
                messageEl.appendChild(textEl);
                chatMessagesBox.appendChild(messageEl);
            });
            chatMessagesBox.scrollTop = chatMessagesBox.scrollHeight;
        });
    </script>
</body>
</html>
