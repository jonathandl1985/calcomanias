<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Streaming</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #121212; color: white; }
        .container { display: grid; grid-template-columns: 250px 1fr 250px; gap: 15px; padding: 20px; }
        .sidebar { background: #1e1e1e; padding: 15px; border-radius: 8px; min-height: 400px; }
        .main-content { display: flex; flex-direction: column; gap: 15px; }
        .stream-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 8px; }
        .stream-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .chat-section { background: #1e1e1e; padding: 15px; border-radius: 8px; height: 300px; display: flex; flex-direction: column; }
        .chat-messages { flex-grow: 1; overflow-y: auto; border-bottom: 1px solid #333; margin-bottom: 10px; padding-bottom: 10px; }
        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex-grow: 1; padding: 8px; border-radius: 4px; border: none; }
        .btn { padding: 8px 15px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <aside class="sidebar" id="noticias-left">
            <h3>Noticias</h3>
            <div id="content-left">Cargando...</div>
        </aside>

        <main class="main-content">
            <div class="stream-container">
                <iframe id="live-stream" src="" allowfullscreen></iframe>
            </div>
            
            <section class="chat-section">
                <h3>Chat en Vivo</h3>
                <div id="auth-block">
                    <button class="btn" id="btn-login">Iniciar sesión con Google</button>
                </div>
                <div id="chat-block" class="hidden">
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="input-msg" placeholder="Escribe un mensaje...">
                        <button class="btn" id="btn-send">Enviar</button>
                    </div>
                </div>
            </section>
        </main>

        <aside class="sidebar" id="noticias-right">
            <h3>Destacados</h3>
            <div id="content-right">Cargando...</div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        // Configuración de tu proyecto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB0JWN4bRHZ8f2tZEQwnxBW8hGmP9XPaEA",
            authDomain: "calcos-6760b.firebaseapp.com",
            projectId: "calcos-6760b",
            storageBucket: "calcos-6760b.firebasestorage.app",
            messagingSenderId: "20210064860",
            appId: "1:20210064860:web:01db78b92e3b0d43400319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 1. ESCUCHAR CAMBIOS DEL PANEL DE ADMINISTRACIÓN
        onValue(ref(db, 'config'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('live-stream').src = data.streamUrl || '';
                document.getElementById('content-left').innerHTML = data.noticiasLeft || 'Sin noticias.';
                document.getElementById('content-right').innerHTML = data.noticiasRight || 'Sin contenido.';
            }
        });

        // 2. AUTENTICACIÓN PARA EL CHAT
        const btnLogin = document.getElementById('btn-login');
        const authBlock = document.getElementById('auth-block');
        const chatBlock = document.getElementById('chat-block');
        let currentUser = null;

        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => console.error(error));
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authBlock.classList.add('hidden');
                chatBlock.classList.remove('hidden');
            } else {
                authBlock.classList.remove('hidden');
                chatBlock.classList.add('hidden');
            }
        });

        // 3. FUNCIONALIDAD DEL CHAT
        const btnSend = document.getElementById('btn-send');
        const inputMsg = document.getElementById('input-msg');
        const chatMessages = document.getElementById('chat-messages');

        btnSend.addEventListener('click', enviarMensaje);
        inputMsg.addEventListener('keypress', (e) => { if(e.key === 'Enter') enviarMensaje(); });

        function enviarMensaje() {
            const text = inputMsg.value.trim();
            if(text === '' || !currentUser) return;

            push(ref(db, 'chat'), {
                name: currentUser.displayName,
                text: text,
                timestamp: Date.now()
            });
            inputMsg.value = '';
        }

        // Escuchar nuevos mensajes del chat
        onValue(ref(db, 'chat'), (snapshot) => {
            chatMessages.innerHTML = '';
            snapshot.forEach((childSnapshot) => {
                const msg = childSnapshot.val();
                const p = document.createElement('p');
                p.innerHTML = `<strong>${msg.name}:</strong> ${msg.text}`;
                chatMessages.appendChild(p);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll al final
        });
    </script>
</body>
</html>
