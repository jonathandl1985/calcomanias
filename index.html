<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Calcomanías</title>
    <style>
        :root { --primary: #8a1538; --disponible: #28a745; --vendida: #dc3545; }
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .content { padding: 15px; flex-grow: 1; }
        .price { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; color: white; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; }
        .disponible { background: var(--disponible); }
        .vendida { background: var(--vendida); }
        .btn-wa { display: block; background: #25D366; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .btn-wa.disabled { background: #ccc; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <h1>Mis Calcomanías del Mundial</h1>
    <p>Actualizado desde Google Sheets</p>
</header>

<div class="grid" id="catalogo">
    </div>

<script>
    // 1. PEGA AQUÍ TU ENLACE DE GOOGLE SHEETS PUBLICADO COMO CSV
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJQymlPdsNUtQuU0A8DKTBc8OxYlPH6MXX7eCnCh01cHLQt85-l82NCVCq7ElplpzUgXdp2bvzYTZn/pubhtml?gid=0&single=true'; 
    const WHATSAPP_NUM = '50250103703'; // Tu número

    async function cargarCalcomanias() {
        const respuesta = await fetch(SHEET_CSV_URL);
        const data = await respuesta.text();
        const filas = data.split('\n').slice(1); // Ignorar encabezado
        const contenedor = document.getElementById('catalogo');

        filas.forEach(fila => {
            const cols = fila.split(',');
            if (cols.length < 4) return;

            const [nombre, desc, precio, estado, img] = cols;
            const esVendida = estado.trim().toLowerCase() === 'vendida';
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${img.trim() || 'https://via.placeholder.com/200'}" alt="${nombre}">
                <div class="content">
                    <span class="badge ${esVendida ? 'vendida' : 'disponible'}">${estado}</span>
                    <h3>${nombre}</h3>
                    <p>${desc}</p>
                    <div class="price">Q${precio}</div>
                    <a href="https://wa.me/${WHATSAPP_NUM}?text=Hola, quiero la calcomanía: ${nombre}" 
                       target="_blank" 
                       class="btn-wa ${esVendida ? 'disabled' : ''}">
                       ${esVendida ? 'AGOTADA' : 'Pedir por WhatsApp'}
                    </a>
                </div>
            `;
            contenedor.appendChild(card);
        });
    }

    cargarCalcomanias();
</script>
</body>
</html>
