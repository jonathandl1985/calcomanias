<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Control de Streaming</title>
    <style>
        :root {
            --bg-admin: #f4f6f9;
            --surface-admin: #ffffff;
            --text-dark: #2d3748;
            --primary: #4a5568;
            --accent: #3182ce;
            --border-admin: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-admin);
            color: var(--text-dark);
            padding: 40px 20px;
        }

        .admin-box {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--surface-admin);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-admin);
            padding: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-admin);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        textarea {
            height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .help-text {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 5px;
        }

        .btn-submit {
            display: inline-block;
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .alert-success {
            background-color: #c6f6d5;
            color: #22543d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-box">
        <h1>Panel de Control de Streaming</h1>
        <p class="subtitle">Gestiona la señal de video y los bloques de contenidos laterales en tiempo real.</p>
        
        <div class="alert-success" id="success-alert">
            ¡Página principal actualizada correctamente en tiempo real!
        </div>

        <div class="form-group">
            <label for="input-stream-url">Dirección URL de Incrustación (Embed Stream URL)</label>
            <input type="text" id="input-stream-url" placeholder="Ej: https://www.youtube.com/embed/LIVE_VIDEO_ID o enlace Twitch embed">
            <p class="help-text">Inserta solo la URL directa que va dentro del 'src' del iframe.</p>
        </div>

        <div class="form-group">
            <label for="input-news-left">Noticias (Bloque Lateral Izquierdo) - Soporta etiquetas HTML</label>
            <textarea id="input-news-left" placeholder="Ej: <h3>¡Nuevo Lanzamiento!</h3> <p>Sigue la transmisión en vivo.</p>"></textarea>
        </div>

        <div class="form-group">
            <label for="input-news-right">Fotografías o Destacados (Bloque Lateral Derecho) - Soporta etiquetas HTML</label>
            <textarea id="input-news-right" placeholder="Ej: <img src='https://tusitio.com/anuncio.jpg' style='width:100%; border-radius:6px;'>"></textarea>
        </div>

        <button class="btn-submit" id="btn-save-config">Actualizar Cambios en Vivo</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIGURACIÓN DE TU FIREBASE (Mismos valores que index.html)
        const firebaseConfig = {
            apiKey: "AIzaSyB0JWN4bRHZ8f2tZEQwnxBW8hGmP9XPaEA",
            authDomain: "calcos-6760b.firebaseapp.com",
            databaseURL: "https://calcos-6760b-default-rtdb.firebaseio.com",
            projectId: "calcos-6760b",
            storageBucket: "calcos-6760b.firebasestorage.app",
            messagingSenderId: "20210064860",
            appId: "1:20210064860:web:01db78b92e3b0d43400319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const inputStreamUrl = document.getElementById('input-stream-url');
        const inputNewsLeft = document.getElementById('input-news-left');
        const inputNewsRight = document.getElementById('input-news-right');
        const btnSaveConfig = document.getElementById('btn-save-config');
        const successAlert = document.getElementById('success-alert');

        // Obtener configuración inicial
        onValue(ref(db, 'live_config'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                inputStreamUrl.value = data.streamUrl || '';
                inputNewsLeft.value = data.newsLeft || '';
                inputNewsRight.value = data.newsRight || '';
            }
        });

        // Guardar la configuración al presionar el botón
        btnSaveConfig.addEventListener('click', () => {
            const url = inputStreamUrl.value.trim();
            const left = inputNewsLeft.value.trim();
            const right = inputNewsRight.value.trim();

            set(ref(db, 'live_config'), {
                streamUrl: url,
                newsLeft: left,
                newsRight: right
            })
            .then(() => {
                successAlert.style.display = 'block';
                setTimeout(() => { successAlert.style.display = 'none'; }, 4000);
            })
            .catch((error) => {
                console.error("Error Firebase:", error);
                alert("Error de conexión/permisos: " + error.message);
            });
        });
    </script>
</body>
</html>
