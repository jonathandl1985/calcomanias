<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Acceso Restringido</title>
    <style>
        :root {
            --bg-admin: #f4f6f9;
            --surface-admin: #ffffff;
            --text-dark: #2d3748;
            --primary: #4a5568;
            --accent: #3182ce;
            --border-admin: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-admin);
            color: var(--text-dark);
            padding: 40px 20px;
        }

        .admin-box {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--surface-admin);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-admin);
            padding: 30px;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto 0 auto;
            background-color: var(--surface-admin);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-admin);
            padding: 30px;
        }

        h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); font-weight: 700; }
        .subtitle { color: #718096; font-size: 0.95rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: var(--primary); }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-admin);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: var(--text-dark);
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        textarea { height: 120px; resize: vertical; }
        .help-text { font-size: 0.8rem; color: #a0aec0; margin-top: 5px; }

        .btn-submit {
            display: inline-block;
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #2b6cb0; }
        
        .btn-logout {
            background-color: #e53e3e;
            float: right;
            padding: 8px 14px;
            font-size: 0.85rem;
        }
        .btn-logout:hover { background-color: #c53030; }

        .alert-success {
            background-color: #c6f6d5;
            color: #22543d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            display: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="section-login" class="login-box">
        <h1>Iniciar Sesión</h1>
        <p class="subtitle">Solo administradores autorizados.</p>
        
        <div class="form-group">
            <label for="login-email">Correo Electrónico</label>
            <input type="email" id="login-email" placeholder="admin@tusitio.com">
        </div>
        <div class="form-group">
            <label for="login-password">Contraseña (Clave)</label>
            <input type="password" id="login-password" placeholder="******">
        </div>
        <button class="btn-submit" id="btn-login-submit">Ingresar al Panel</button>
    </div>


    <div id="section-panel" class="admin-box hidden">
        <button class="btn-submit btn-logout" id="btn-logout">Cerrar Sesión</button>
        <h1>Panel de Control de Streaming</h1>
        <p class="subtitle">Gestiona la señal de video y los bloques de contenidos laterales en tiempo real.</p>
        
        <div class="alert-success" id="success-alert">
            ¡Página principal actualizada correctamente en tiempo real!
        </div>

        <div class="form-group">
            <label for="input-stream-url">Dirección URL de Incrustación (Embed Stream URL)</label>
            <input type="text" id="input-stream-url" placeholder="Ej: https://www.youtube.com/embed/LIVE_VIDEO_ID">
            <p class="help-text">Inserta solo la URL directa que va dentro del 'src' del iframe.</p>
        </div>

        <div class="form-group">
            <label for="input-news-left">Noticias (Bloque Lateral Izquierdo) - Soporta HTML</label>
            <textarea id="input-news-left" placeholder="Contenido izquierdo..."></textarea>
        </div>

        <div class="form-group">
            <label for="input-news-right">Fotografías o Destacados (Bloque Lateral Derecho) - Soporta HTML</label>
            <textarea id="input-news-right" placeholder="Contenido derecho..."></textarea>
        </div>

        <button class="btn-submit" id="btn-save-config">Actualizar Cambios en Vivo</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURACIÓN DE TU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB0JWN4bRHZ8f2tZEQwnxBW8hGmP9XPaEA",
            authDomain: "calcos-6760b.firebaseapp.com",
            databaseURL: "https://calcos-6760b-default-rtdb.firebaseio.com",
            projectId: "calcos-6760b",
            storageBucket: "calcos-6760b.firebasestorage.app",
            messagingSenderId: "20210064860",
            appId: "1:20210064860:web:01db78b92e3b0d43400319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ELEMENTOS DOM
        const sectionLogin = document.getElementById('section-login');
        const sectionPanel = document.getElementById('section-panel');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const btnLoginSubmit = document.getElementById('btn-login-submit');
        const btnLogout = document.getElementById('btn-logout');

        const inputStreamUrl = document.getElementById('input-stream-url');
        const inputNewsLeft = document.getElementById('input-news-left');
        const inputNewsRight = document.getElementById('input-news-right');
        const btnSaveConfig = document.getElementById('btn-save-config');
        const successAlert = document.getElementById('success-alert');

        // =========================================================================
        // ⚠️ ATENCIÓN: COLOCA TU CORREO DE ADMINISTRADOR AQUÍ ABAJO EN MINÚSCULAS
        // =========================================================================
        const EMAIL_ADMINISTRADOR = "jonathandeleonc@gmail.com";

        // 1. CONTROL DE SESIÓN AUTOMÁTICO
        onAuthStateChanged(auth, (user) => {
            if (user && user.email.toLowerCase() === EMAIL_ADMINISTRADOR.trim().toLowerCase()) {
                sectionLogin.classList.add('hidden');
                sectionPanel.classList.remove('hidden');
                cargarDatosPanel();
            } else {
                sectionLogin.classList.remove('hidden');
                sectionPanel.classList.add('hidden');
            }
        });

        // 2. EJECUTAR INICIO DE SESIÓN CON VALIDADOR MEJORADO
        btnLoginSubmit.addEventListener('click', () => {
            const emailInput = loginEmail.value.trim().toLowerCase();
            const passwordInput = loginPassword.value;
            
            const emailAdminConfigurado = EMAIL_ADMINISTRADOR.trim().toLowerCase();

            // Comprobación exacta sin importar mayúsculas/minúsculas o espacios accidentales
            if (emailInput !== emailAdminConfigurado) {
                alert("ERROR: El correo ingresado [" + emailInput + "] no coincide con el administrador configurado en el código [" + emailAdminConfigurado + "].");
                return;
            }

            // Petición de login a Firebase
            signInWithEmailAndPassword(auth, emailInput, passwordInput)
                .then((userCredential) => {
                    console.log("¡Logueado con éxito!", userCredential.user);
                })
                .catch((error) => {
                    console.error("Error Firebase:", error);
                    
                    if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        alert("Contraseña incorrecta. Verifica tu clave.");
                    } else if (error.code === 'auth/operation-not-allowed') {
                        alert("ERROR: Activa el método de 'Correo electrónico/contraseña' en Authentication -> Sign-in method de Firebase.");
                    } else {
                        alert("Error de autenticación: " + error.message);
                    }
                });
        });

        // 3. CERRAR SESIÓN
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // 4. FUNCIONES PROPIAS DEL PANEL
        function cargarDatosPanel() {
            onValue(ref(db, 'live_config'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    inputStreamUrl.value = data.streamUrl || '';
                    inputNewsLeft.value = data.newsLeft || '';
                    inputNewsRight.value = data.newsRight || '';
                }
            });
        }

        btnSaveConfig.addEventListener('click', () => {
            const url = inputStreamUrl.value.trim();
            const left = inputNewsLeft.value.trim();
            const right = inputNewsRight.value.trim();

            set(ref(db, 'live_config'), {
                streamUrl: url,
                newsLeft: left,
                newsRight: right
            })
            .then(() => {
                successAlert.style.display = 'block';
                setTimeout(() => { successAlert.style.display = 'none'; }, 4000);
            })
            .catch((error) => {
                alert("Error al guardar cambios: " + error.message);
            });
        });
    </script>
</body>
</html>
