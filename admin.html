<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Administrador</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background-color: #f4f4f4; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 100px; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Panel de Administración</h1>
    
    <div class="form-group">
        <label for="stream-url">URL de Incrustación del Streaming (Iframe / YouTube / Twitch / RTMP):</label>
        <input type="text" id="stream-url" placeholder="Ej: https://www.youtube.com/embed/live_stream?channel=UC...">
    </div>

    <div class="form-group">
        <label for="news-left">Contenido Lateral Izquierdo (Noticias - Soporta HTML/Fotos):</label>
        <textarea id="news-left" placeholder="<p>¡Nueva noticia!</p> <img src='url_foto.jpg' width='100%'>"></textarea>
    </div>

    <div class="form-group">
        <label for="news-right">Contenido Lateral Derecho (Fotos/Publicidad - Soporta HTML):</label>
        <textarea id="news-right" placeholder="Coloca tus imágenes o textos aquí..."></textarea>
    </div>

    <button class="btn" id="btn-guardar">Actualizar Página Web</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        // Misma configuración de Firebase del paso anterior
        const firebaseConfig = {
            apiKey: "AIzaSyB0JWN4bRHZ8f2tZEQwnxBW8hGmP9XPaEA",
            authDomain: "calcos-6760b.firebaseapp.com",
            projectId: "calcos-6760b",
            storageBucket: "calcos-6760b.firebasestorage.app",
            messagingSenderId: "20210064860",
            appId: "1:20210064860:web:01db78b92e3b0d43400319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Cargar valores actuales de la web
        onValue(ref(db, 'config'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('stream-url').value = data.streamUrl || '';
                document.getElementById('news-left').value = data.noticiasLeft || '';
                document.getElementById('news-right').value = data.noticiasRight || '';
            }
        });

        // Guardar nuevos valores
        document.getElementById('btn-guardar').addEventListener('click', () => {
            const url = document.getElementById('stream-url').value;
            const left = document.getElementById('news-left').value;
            const right = document.getElementById('news-right').value;

            set(ref(db, 'config'), {
                streamUrl: url,
                noticiasLeft: left,
                noticiasRight: right
            }).then(() => {
                alert("¡Página actualizada con éxito!");
            }).catch(error => {
                alert("Error al actualizar: " + error.message);
            });
        });
    </script>
</body>
</html>
